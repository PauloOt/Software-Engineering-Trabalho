name: CI - TaskFlow Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Testes automatizados com Pytest
  # ─────────────────────────────────────────────
  testes:
    name: Testes Automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes com cobertura
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

  # ─────────────────────────────────────────────
  # JOB 2: Qualidade de código com Flake8
  # ─────────────────────────────────────────────
  qualidade:
    name: Qualidade do Código (Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Flake8
        run: pip install flake8

      - name: Analisar qualidade do código
        run: |
          flake8 src/ --max-line-length=100 --exclude=__pycache__ --statistics
